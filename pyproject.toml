[project]
name = "mbhd"
version = "0.1.0"
description = "Independent reproduction of the Duvallet et al. (2017) gut microbiome meta-analysis"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "matplotlib>=3.11.2",
    "pandas>=3.0.5",
    "pyyaml>=6.0.3",
    "scikit-learn>=1.7.2",
    "snakemake>=9.27.0",
]


[build-system]
requires = ["uv_build>=0.12.11,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pycombat>=0.20",
    "pytest>=9.1.1",
    "ruff>=0.16.6",
    "scipy>=1.18.1",
    "statsmodels>=0.15.0",
]

[tool.ruff]
target-version = "py312"
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"
